name: Deploy CV to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Deploy index.html over SSH
        env:
          CV_DEPLOY_KEY: ${{ secrets.CV_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CV_DEPLOY_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$CV_DEPLOY_KEY" > "$HOME/.ssh/cv_deploy"
          chmod 600 "$HOME/.ssh/cv_deploy"
          printf '%s\n' 'horbatov.duckdns.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPbvJJO5Gz0FZgu8m8H36gwWFlwWpyN9OIUWqOGv3sEu' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -i "$HOME/.ssh/cv_deploy" \
            cvdeploy@horbatov.duckdns.org < index.html

      - name: Verify the public site
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 15 --max-time 30 \
            https://horbatov.duckdns.org/ -o "$RUNNER_TEMP/deployed-index.html"
          cmp index.html "$RUNNER_TEMP/deployed-index.html"
          echo 'The public site matches this commit.'
